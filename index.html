  .board::before{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(0,0,0,.18) 1px, transparent 1.4px);
    background-size:7px 7px;
    opacity:.35;
    pointer-events:none;
    mix-blend-mode:multiply;
  }

  /* ---------- red thread ---------- */
  svg.strings{
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none;
  }
  svg.strings path.shadow{
    fill:none; stroke:#000; stroke-width:3.2; stroke-linecap:round;
    opacity:0; filter:blur(1.5px); transition:opacity .6s ease;
  }
  svg.strings path.thread{
    fill:none;
    stroke:var(--string);
    stroke-width:1.9;
    stroke-linecap:round;
    opacity:0;
    transition:opacity .6s ease;
  }
  svg.strings path.shine{
    fill:none;
    stroke:var(--string-hi);
    stroke-width:.7;
    stroke-linecap:round;
    opacity:0;
    transition:opacity .6s ease;
  }
  svg.strings .visible.shadow{ opacity:.35; }
  svg.strings .visible.thread{ opacity:.92; }
  svg.strings .visible.shine{ opacity:.5; }
  svg.strings circle.knot{
    fill:#7a1912; opacity:0; transition:opacity .6s ease;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.6));
  }
  svg.strings circle.knot.visible{ opacity:.9; }

  /* ---------- decorative board clutter (non-interactive) ---------- */
  .prop{ position:absolute; pointer-events:none; opacity:.85; }
  .prop.loose-pin{ width:15px; height:15px; }
  .prop.loose-pin .pin{ position:static; transform:none; }
  .prop.stain{ opacity:.5; }
  .prop.glass{ opacity:.55; }

  /* ---------- sticky notes on the board ---------- */
  .note{
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    background:
      linear-gradient(100deg, rgba(255,255,255,.22) 0%, transparent 20%),
      linear-gradient(155deg, var(--note) 0%, var(--note) 50%, var(--note-shade) 100%);
    box-shadow:
      0 1px 0 rgba(255,255,255,.22) inset,
      2px 4px 8px rgba(0,0,0,.42),
      6px 12px 20px rgba(0,0,0,.32);
    cursor:pointer;
    padding:10px;
    transition: filter .4s ease, box-shadow .2s ease;
    user-select:none;
    will-change:transform;
  }

  .note::before{
    content:"";
    position:absolute; right:0; bottom:0; width:20px; height:20px;
    background:
      linear-gradient(135deg, transparent 50%, rgba(0,0,0,.24) 50%, rgba(0,0,0,.24) 62%, transparent 62%),
      linear-gradient(135deg, transparent 60%, rgba(255,255,255,.35) 60%);
    pointer-events:none;
  }
  .note:hover{ box-shadow:0 1px 0 rgba(255,255,255,.22) inset, 3px 6px 12px rgba(0,0,0,.48), 7px 14px 22px rgba(0,0,0,.36); }
  .note:active{ filter:brightness(.97); }

  .note.level-3{
    background:
      linear-gradient(100deg, rgba(255,255,255,.18) 0%, transparent 20%),
      linear-gradient(155deg, var(--note-final) 0%, var(--note-final) 50%, var(--note-final-shade) 100%);
  }

  .note.locked{
    background:var(--note-locked) !important;
    filter:grayscale(.4) brightness(.76);
    cursor:default;
  }
  .note.locked:hover{ box-shadow:2px 4px 8px rgba(0,0,0,.42), 6px 12px 20px rgba(0,0,0,.32); }

  .note.shake{ animation:shake .4s ease; }
  @keyframes shake{
    10%,90%{ transform:rotate(var(--rot)) translateX(-2px); }
    20%,80%{ transform:rotate(var(--rot)) translateX(4px); }
    30%,50%,70%{ transform:rotate(var(--rot)) translateX(-7px); }
    40%,60%{ transform:rotate(var(--rot)) translateX(7px); }
  }

  .note .mark{
    font-family:'Caveat',cursive;
    font-weight:700;
    color:var(--ink);
    font-size:19px;
    line-height:1.15;
    letter-spacing:.2px;
    white-space:nowrap;
    display:inline-block;
  }
  .note.level-3 .mark{ font-size:23px; }
  .note .qmark{
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:32px;
    color:rgba(20,16,10,.55);
  }
  .note.locked .qmark, .note.locked .mark{ visibility:hidden; }

  .pin{
    position:absolute; top:-10px; left:50%; transform:translateX(-50%);
    width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--pin-hi), var(--pin) 70%);
    box-shadow:0 2px 3px rgba(0,0,0,.6), inset 0 0 2px rgba(0,0,0,.4);
    z-index:5;
  }

  /* ---------- backdrop ---------- */
  .backdrop{
    position:fixed; inset:0; background:
      radial-gradient(ellipse at center, rgba(60,55,48,.35), transparent 60%),
      var(--overlay);
    opacity:0; pointer-events:none; transition:opacity .4s ease;
    z-index:50; backdrop-filter:blur(1.5px);
  }
  .backdrop.show{ opacity:1; pointer-events:auto; }

  /* ---------- the note itself, flown to the centre and enlarged ---------- */
  .focus-note{
    position:fixed; top:50%; left:50%;
    width:min(560px, 90vw);
    max-height:82vh;
    background:
      linear-gradient(100deg, rgba(255,255,255,.20) 0%, transparent 22%),
      linear-gradient(160deg, var(--note) 0%, var(--note) 48%, var(--note-shade) 100%);
    box-shadow:0 24px 60px rgba(0,0,0,.65), 0 2px 0 rgba(255,255,255,.12) inset;
    z-index:60;
    display:none;
    padding:30px 28px 24px;
    overflow-y:auto;
    transform:translate(-50%,-50%);
    transition:transform .46s cubic-bezier(.2,.9,.25,1);
    clip-path: polygon(
      0.5% 2%, 8% 0%, 22% 1.2%, 39% 0%, 55% 1%, 71% 0%, 86% 1.4%, 99% 0%,
      100% 14%, 99.3% 33%, 100% 52%, 99.4% 71%, 100% 88%, 99.5% 100%,
      82% 99.2%, 63% 100%, 44% 99.3%, 27% 100%, 12% 99.2%, 0% 100%,
      0.7% 82%, 0% 63%, 0.6% 44%, 0% 26%, 0.8% 12%
    );
  }

/* =========================================================================
   ЛОГИКА ОТКРЫТИЯ
========================================================================= */

const state = { opened:new Set(), available:new Set(["0"]) };
const byId = Object.fromEntries(NODES.map(n=>[n.id,n]));

function recompute(){
  NODES.forEach(n=>{
    if(state.opened.has(n.id) || state.available.has(n.id)) return;
    if(n.level===1 && state.opened.has("0")) state.available.add(n.id);
    if(n.level===2 && n.parents.every(p=>state.opened.has(p))) state.available.add(n.id);
    if(n.level===3){
      const restOpened = NODES.filter(o=>o.level<3).every(o=>state.opened.has(o.id));
      if(restOpened) state.available.add(n.id);
    }
  });
}

function fitText(el, n){
  const maxWidth = n.w - 16;
  let size = n.level===3 ? 23 : 19;
  el.style.fontSize = size+"px";
  el.style.whiteSpace = "nowrap";
  while(el.scrollWidth > maxWidth && size > 9){
    size -= 1;
    el.style.fontSize = size+"px";
  }
}

function render(){
  NODES.forEach(n=>{
    const el = document.getElementById("note-"+n.id);
    const opened = state.opened.has(n.id);
    const avail = state.available.has(n.id);
    el.classList.toggle("locked", !opened && !avail);
    const markEl = el.querySelector(".mark");
    markEl.textContent = opened ? n.word : "";
    el.querySelector(".qmark").style.display = (!opened && avail) ? "block" : "none";
    if(opened) fitText(markEl, n);
  });
  document.querySelectorAll("svg.strings .seg").forEach(p=>{
    const a = p.dataset.a, b = p.dataset.b;
    const show = (state.available.has(a)||state.opened.has(a)) &&
                 (state.available.has(b)||state.opened.has(b));
    p.classList.toggle("visible", show);
  });
}

/* =========================================================================
   ОТКРЫТИЕ СТИКЕРА ПО ЦЕНТРУ («поднесли ближе»)
========================================================================= */

const focusNote = document.getElementById("focusNote");
const backdrop = document.getElementById("backdrop");
let activeId = null;

function buildDetail(n){
  document.getElementById("focusTitle").textContent = n.word;
  document.getElementById("focusSub").textContent = n.sub || "";
  document.getElementById("focusFaceMark").textContent = n.word;
  const body = document.getElementById("focusBody");
  body.innerHTML = "";

  const paragraphs = n.text.trim().split(/\n\s*\n/).map(p=>p.replace(/\s+/g," ").trim());

  paragraphs.forEach(text=>{
    const p = document.createElement("p");
    p.textContent = text;
    body.appendChild(p);
  });
}

function flyToCenter(sourceEl, n){
  focusNote.className = "focus-note level-"+n.level+" showing";
  buildDetail(n);

  focusNote.style.transition = "none";
  focusNote.style.transform = "translate(-50%,-50%)";
  const r2 = focusNote.getBoundingClientRect();
  const r1 = sourceEl.getBoundingClientRect();

  const dx = (r1.left + r1.width/2) - (r2.left + r2.width/2);
  const dy = (r1.top + r1.height/2) - (r2.top + r2.height/2);
  const sx = r1.width / r2.width;
  const sy = r1.height / r2.height;

  focusNote.style.transform =
    `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${sx}, ${sy}) rotate(${n.rot}deg)`;

  void focusNote.offsetWidth;
  focusNote.style.transition = "transform .46s cubic-bezier(.2,.9,.25,1)";
  requestAnimationFrame(()=>{
    focusNote.style.transform = "translate(-50%,-50%) scale(1,1) rotate(0deg)";
  });

  backdrop.classList.add("show");
  setTimeout(()=> focusNote.classList.add("open"), 300);
}

function flyBack(){
  const n = byId[activeId];
  const sourceEl = document.getElementById("note-"+activeId);
  focusNote.classList.remove("open");

  const r1 = sourceEl.getBoundingClientRect();
  const r2 = focusNote.getBoundingClientRect();
  const dx = (r1.left + r1.width/2) - (r2.left + r2.width/2);
  const dy = (r1.top + r1.height/2) - (r2.top + r2.height/2);
  const sx = r1.width / r2.width;
  const sy = r1.height / r2.height;

  backdrop.classList.remove("show");
  setTimeout(()=>{
    focusNote.style.transform =
      `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${sx}, ${sy}) rotate(${n.rot}deg)`;
    setTimeout(()=>{
      focusNote.classList.remove("showing");
      activeId = null;
    }, 460);
  }, 120);
}

function openNode(id){
  const n = byId[id];
  const isAvail = state.available.has(id) || state.opened.has(id);
  const sourceEl = document.getElementById("note-"+id);
  if(!isAvail){
    sourceEl.classList.remove("shake"); void sourceEl.offsetWidth;
    sourceEl.classList.add("shake");
    return;
  }
  state.opened.add(id);
  recompute();
  render();
  activeId = id;
  flyToCenter(sourceEl, n);
}

function closeFocus(){
  if(activeId) flyBack();
}

/* =========================================================================
   ДЕКОРАТИВНЫЕ ЭЛЕМЕНТЫ ДОСКИ
========================================================================= */

function buildProps(board){
  PROPS.forEach(p=>{
    const el = document.createElement("div");
    el.className = "prop " + (p.type==="pin" ? "loose-pin" : p.type==="glass" ? "glass" : "stain");
    el.style.left = p.x+"px";
    el.style.top = p.y+"px";
    if(p.rot) el.style.transform = `rotate(${p.rot}deg)`;

    if(p.type==="pin"){
      el.innerHTML = `<div class="pin"></div>`;
    } else if(p.type==="glass"){
      el.innerHTML = `
        <svg width="60" height="60" viewBox="0 0 60 60">
          <circle cx="24" cy="24" r="14" fill="none" stroke="#1a1410" stroke-width="3" opacity=".55"/>
          <circle cx="24" cy="24" r="14" fill="#eaf2f2" opacity=".08"/>
          <line x1="34" y1="34" x2="52" y2="52" stroke="#1a1410" stroke-width="4" stroke-linecap="round" opacity=".55"/>
        </svg>`;
    } else if(p.type==="stain"){
      el.innerHTML = `
        <svg width="70" height="70" viewBox="0 0 70 70">
          <ellipse cx="35" cy="35" rx="32" ry="28" fill="none" stroke="#3a2210" stroke-width="2" opacity=".35"/>
          <ellipse cx="35" cy="35" rx="24" ry="21" fill="none" stroke="#3a2210" stroke-width="1.4" opacity=".25"/>
        </svg>`;
    }
    board.appendChild(el);
  });
}

/* =========================================================================
   ПОСТРОЕНИЕ DOM
========================================================================= */

const board = document.getElementById("board");

NODES.forEach(n=>{
  const el = document.createElement("div");
  el.className = "note level-"+n.level+" locked";
  el.id = "note-"+n.id;
  el.style.left = n.x+"px";
  el.style.top = n.y+"px";
  el.style.width = n.w+"px";
  el.style.height = n.h+"px";
  el.style.setProperty("--rot", n.rot+"deg");
  el.style.transform = "rotate("+n.rot+"deg)";
  el.innerHTML = `
    <div class="pin"></div>
    <span class="qmark">?</span>
    <span class="mark"></span>
  `;
  el.addEventListener("click", ()=>openNode(n.id));
  el.setAttribute("tabindex","0");
  el.setAttribute("role","button");
  el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openNode(n.id);} });
  board.appendChild(el);
});

buildProps(board);

/* strings: shadow + main thread + glossy highlight, with a small pinned
   "knot" dot at a random point along a few threads for extra realism,
   and per-link randomized sag so some strands hang looser than others */
const svg = document.getElementById("strings");
svg.setAttribute("viewBox", `0 0 1160 980`);
function pinPos(id){
  const n = byId[id];
  return { x:n.x+n.w/2, y:n.y+2 };
}
function seeded(i){
  const x = Math.sin(i*12.9898)*43758.5453;
  return x - Math.floor(x);
}
LINKS.forEach(([a,b], i)=>{
  const pa = pinPos(a), pb = pinPos(b);
  const mx = (pa.x+pb.x)/2, my = (pa.y+pb.y)/2;
  const dx = pb.x-pa.x, dy = pb.y-pa.y;
  const dist = Math.hypot(dx,dy);
  const sagRand = 0.6 + seeded(i)*0.9; // some threads sag noticeably more
  const sag = Math.min(58, dist*0.10*sagRand);
  const nx = -dy/dist, ny = dx/dist;
  const cx = mx + nx*sag, cy = my + ny*sag + 14;
  const d = `M ${pa.x} ${pa.y} Q ${cx} ${cy} ${pb.x} ${pb.y}`;

  const shadow = document.createElementNS("http://www.w3.org/2000/svg","path");
  shadow.setAttribute("d", d);
  shadow.setAttribute("class","seg shadow");
  shadow.setAttribute("transform","translate(1.5,2.5)");
  shadow.dataset.a=a; shadow.dataset.b=b;
  svg.appendChild(shadow);

  const thread = document.createElementNS("http://www.w3.org/2000/svg","path");
  thread.setAttribute("d", d);
  thread.setAttribute("class","seg thread");
  thread.dataset.a=a; thread.dataset.b=b;
  svg.appendChild(thread);

  const shine = document.createElementNS("http://www.w3.org/2000/svg","path");
  shine.setAttribute("d", d);
  shine.setAttribute("class","seg shine");
  shine.setAttribute("transform","translate(-0.6,-0.6)");
  shine.dataset.a=a; shine.dataset.b=b;
  svg.appendChild(shine);

  // occasional little pinned knot roughly a third of the way along the sag
  if(seeded(i+50) > 0.55){
    const t = 0.35 + seeded(i+90)*0.3;
    const qx = (1-t)*(1-t)*pa.x + 2*(1-t)*t*cx + t*t*pb.x;
    const qy = (1-t)*(1-t)*pa.y + 2*(1-t)*t*cy + t*t*pb.y;
    const knot = document.createElementNS("http://www.w3.org/2000/svg","circle");
    knot.setAttribute("cx", qx); knot.setAttribute("cy", qy); knot.setAttribute("r", 3.4);
    knot.setAttribute("class","seg knot");
    knot.dataset.a=a; knot.dataset.b=b;
    svg.appendChild(knot);
  }
});

/* =========================================================================
   МАСШТАБИРОВАНИЕ ПОД ЭКРАН
========================================================================= */

function fitBoard(){
  const vp = document.getElementById("viewport");
  const spacer = document.getElementById("spacer");
  const fitScale = Math.min(1, (vp.clientWidth-24)/1160, (vp.clientHeight-24)/980);
  const scale = Math.max(fitScale, 0.62);
  board.style.transform = `scale(${scale})`;
  spacer.style.width = (1160*scale)+"px";
  spacer.style.height = (980*scale)+"px";
}
window.addEventListener("resize", fitBoard);

/* =========================================================================
   ИНИЦИАЛИЗАЦИЯ
========================================================================= */

document.getElementById("focusClose").addEventListener("click", closeFocus);
backdrop.addEventListener("click", closeFocus);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeFocus(); });

recompute();
render();
fitBoard();
</script>
